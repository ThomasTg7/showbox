# ShowBox Promotions en un VPS propio (Docker Compose). Guía: docs/vps-migration.md
#
#   cp deploy/env.example deploy/.env        # y completa los valores
#   docker compose -f deploy/docker-compose.prod.yml up -d postgres minio minio-setup
#   docker compose -f deploy/docker-compose.prod.yml run --rm migrate
#   docker compose -f deploy/docker-compose.prod.yml build app     # lee la base al construir (ver deploy/Dockerfile)
#   docker compose -f deploy/docker-compose.prod.yml up -d
#
# Qué corre: la app Next.js (standalone), Postgres 17, MinIO (imágenes, compatible S3), Umami (analítica sin cookies),
# Caddy (HTTPS automático para el sitio, el panel, las imágenes y las estadísticas), un cron diario de limpieza y copias
# diarias de la base y de las imágenes en BACKUP_DIR (por defecto deploy/backups): sácalas también fuera del servidor.
name: showbox-prod

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-showbox}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    # Solo en el propio servidor: `next build` lee la base al construir (red del servidor, 127.0.0.1) y pg_dump/pg_restore.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Almacenamiento de imágenes compatible con S3. Los navegadores hablan con él a través de Caddy (MEDIA_HOST), nunca directo.
  # Imagen: MinIO dejó de publicar imágenes oficiales (Docker Hub y quay.io ya no las entregan); Chainguard compila MinIO desde
  # el código fuente (gratis, etiqueta `latest`, sin shell). Para fijar una versión, anota el digest que descarga `compose pull`.
  minio:
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?define MINIO_ROOT_USER en deploy/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?define MINIO_ROOT_PASSWORD en deploy/.env}
      # CORS (mismo criterio que el bucket de R2): el navegador sube el original directo (PUT) y lo relee (GET). Orígenes: el
      # panel (de donde se sube) y el sitio. MinIO acepta cualquier encabezado, incluidos Content-Type e If-None-Match.
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_CORS_ORIGINS:?define MINIO_CORS_ORIGINS en deploy/.env}
    volumes:
      - miniodata:/data

  # Crea el bucket y lo deja con lectura pública (las imágenes son públicas; escribir exige las credenciales).
  minio-setup:
    image: cgr.dev/chainguard/minio-client:latest-dev
    depends_on:
      - minio
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-showbox}
    entrypoint:
      - /bin/sh
      - -c
      - >
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 2; done &&
        mc mb --ignore-existing "local/$$S3_BUCKET" &&
        mc anonymous set download "local/$$S3_BUCKET"

  # Herramientas de una sola vez (no arrancan con `up`): migraciones y primer administrador.
  migrate:
    profiles: ["tools"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-showbox}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?define BETTER_AUTH_SECRET en deploy/.env}
      SITE_URL: ${SITE_URL}
      ADMIN_URL: ${ADMIN_URL}

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: runner
      secrets: [buildenv]
      # `next build` lee la base: el build usa la red del servidor para llegar al Postgres publicado en 127.0.0.1
      # (`host.docker.internal` no sirve en Linux: apunta al puente de Docker, que no alcanza un puerto ligado a 127.0.0.1).
      network: host
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
    # No se publica el puerto de Next: todo entra por Caddy, que pone la IP real en X-Forwarded-For (el límite de 5 envíos
    # por IP de los formularios lee esa cabecera; si Next quedara expuesto, cualquiera podría falsearla).
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-showbox}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      SITE_URL: ${SITE_URL}
      ADMIN_URL: ${ADMIN_URL}
      CRON_SECRET: ${CRON_SECRET:?define CRON_SECRET en deploy/.env}
      STORAGE_DRIVER: s3
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-showbox}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}
      MAIL_DRIVER: ${MAIL_DRIVER:-console}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      ANALYTICS_PROVIDER: ${ANALYTICS_PROVIDER:-none}
      UMAMI_SRC: ${UMAMI_SRC:-}
      UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
      ALLOW_INDEXING: ${ALLOW_INDEXING:-}

  # Analítica sin cookies, autoalojada. Primer ingreso: usuario `admin`, contraseña `umami` (cámbiala de inmediato) y
  # crea el sitio: su id va en UMAMI_WEBSITE_ID y el script en UMAMI_SRC (https://<STATS_HOST>/script.js).
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:?define UMAMI_APP_SECRET en deploy/.env}
      DISABLE_TELEMETRY: "1"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
      - minio
    ports:
      - "${CADDY_HTTP_PORT:-80}:${CADDY_HTTP_PORT:-80}"
      - "${CADDY_HTTPS_PORT:-443}:443"
      - "${CADDY_HTTPS_PORT:-443}:443/udp"
    environment:
      SITE_HOST: ${SITE_HOST:?define SITE_HOST en deploy/.env}
      ADMIN_HOST: ${ADMIN_HOST:?define ADMIN_HOST en deploy/.env}
      WWW_HOST: ${WWW_HOST:?define WWW_HOST en deploy/.env}
      SITE_URL: ${SITE_URL:?define SITE_URL en deploy/.env}
      MEDIA_HOST: ${MEDIA_HOST:?define MEDIA_HOST en deploy/.env}
      STATS_HOST: ${STATS_HOST:?define STATS_HOST en deploy/.env}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    # La app llama a MinIO por la misma dirección pública que usan los navegadores (las URLs de subida van firmadas para ese
    # dominio): dentro de la red, el dominio de medios apunta a Caddy.
    networks:
      default:
        aliases:
          - ${MEDIA_HOST_ALIAS:-media.invalid}

  # Limpieza diaria (papelera de 30 días, subidas abandonadas, imágenes sin uso): llama a /api/cron/purge con el secreto.
  cron:
    image: alpine:3.20
    restart: unless-stopped
    depends_on:
      - app
    environment:
      CRON_SECRET: ${CRON_SECRET}
    command: ["crond", "-f", "-l", "8", "-c", "/etc/crontabs"]
    volumes:
      - ./cron/crontab:/etc/crontabs/root:ro
      - ./cron/purge.sh:/usr/local/bin/purge.sh:ro

  # Copias diarias en el disco del servidor (una al arrancar y luego cada 24 h). Protegen de un error o de una actualización
  # que sale mal, no de perder el servidor: copia BACKUP_DIR fuera de él (docs/vps-migration.md → «Copias»).
  backup-db:
    image: postgres:17
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-showbox}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    entrypoint: ["sh", "/usr/local/bin/backup-db.sh"]
    volumes:
      - ./backup/backup-db.sh:/usr/local/bin/backup-db.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups

  backup-media:
    image: cgr.dev/chainguard/minio-client:latest-dev
    restart: unless-stopped
    depends_on:
      minio-setup:
        condition: service_completed_successfully
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-showbox}
    entrypoint: ["sh", "/usr/local/bin/backup-media.sh"]
    volumes:
      - ./backup/backup-media.sh:/usr/local/bin/backup-media.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups

secrets:
  buildenv:
    file: ./.env

volumes:
  pgdata:
  miniodata:
  caddy_data:
  caddy_config:
